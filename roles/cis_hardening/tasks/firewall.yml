---
# Firewall - CIS 3.5 (nftables)

- name: Firewall | Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Firewall | Deploy hardened ruleset
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    content: |
      #!/usr/sbin/nft -f
      # CIS hardened baseline - managed by Ansible
      flush ruleset

      table inet filter {
        chain input {
          type filter hook input priority 0;
          policy drop;

          # Loopback
          iif lo accept
          ip saddr 127.0.0.0/8 iif != lo drop
          ip6 saddr ::1 iif != lo drop

          # Established / related
          ct state established,related accept

          # ICMP (ping)
          ip protocol icmp accept
          ip6 nexthdr icmpv6 accept

          # SSH (à adapter si ton port diffère)
          tcp dport 22 accept
        }

        chain forward {
          type filter hook forward priority 0;
          policy drop;
        }

        chain output {
          type filter hook output priority 0;
          policy accept;
        }
      }
    owner: root
    group: root
    mode: '0644'
  notify: Reload nftables

- name: Firewall | Enable and start nftables
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started
