---
# Password Policy - CIS 5.x

- name: Password | Install libpwquality
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Password | Set password aging in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^{{ item.key }}\s'
    line: '{{ item.key }}   {{ item.value }}'
  loop:
    - { key: 'PASS_MAX_DAYS', value: '90' }
    - { key: 'PASS_MIN_DAYS', value: '1' }
    - { key: 'PASS_WARN_AGE', value: '7' }
    - { key: 'ENCRYPT_METHOD', value: 'SHA512' }

- name: Password | Configure pwquality
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
    create: true
  loop:
    - { key: 'minlen', value: '14' }
    - { key: 'dcredit', value: '-1' }
    - { key: 'ucredit', value: '-1' }
    - { key: 'lcredit', value: '-1' }
    - { key: 'ocredit', value: '-1' }
    - { key: 'retry', value: '3' }
