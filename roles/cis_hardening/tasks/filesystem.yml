---
# Filesystem Hardening - CIS 1.1.x
# Uses ansible.posix.mount instead of raw `command` — the module
# compares current mount options before remounting, so re-running
# the role is safe and reports changed=0.

- name: Filesystem | Harden /tmp mount options
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: rw,nosuid,nodev,noexec
    state: mounted

- name: Filesystem | Create /var/tmp bind mount entry
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+/var/tmp\s'
    line: '/tmp /var/tmp none bind,nosuid,nodev,noexec 0 0'
    create: true

- name: Filesystem | Apply /var/tmp bind mount
  ansible.posix.mount:
    path: /var/tmp
    src: /tmp
    fstype: none
    opts: bind,nosuid,nodev,noexec
    state: mounted

- name: Filesystem | Harden /dev/shm mount options
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: rw,nosuid,nodev,noexec
    state: mounted
